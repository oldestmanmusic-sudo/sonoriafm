<mjml>
  <mj-head>
    <mj-title>Nueva sugerencia en {{app_name}}</mj-title>
    <mj-preview>Tienes una nueva sugerencia de un oyente para revisar</mj-preview>
    <mj-attributes>
      <mj-all font-family="'Plus Jakarta Sans', Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 32px" />
      <mj-text color="#14141f" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#8b33ff" border-radius="24px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f0f0f4">
    <mj-section background-color="#8b33ff" padding="20px 32px">
      <mj-column>
        <mj-image src="https://media.base44.com/images/public/6ace0c27732bbb0f4d7504e1/48211085c_logo.png" alt="SONORIA" width="120px" align="left" />
        <mj-text color="#ffffff" font-size="20px" font-weight="800" padding="8px 0 0 0">SONORIA</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="36px 32px 12px 32px">
      <mj-column>
        <mj-text font-size="26px" font-weight="800" line-height="1.2">Nueva sugerencia</mj-text>
        <mj-text color="#8b33ff">Alguien ha dejado una sugerencia en el buzón de la web.</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="0 32px 12px 32px">
      <mj-column background-color="#f0f0f4" border-radius="24px" padding="20px 24px">
        <mj-text font-size="13px" font-weight="700" color="#8b33ff">TIPO</mj-text>
        <mj-text font-weight="700">{{category}}</mj-text>
        <mj-text font-size="13px" font-weight="700" color="#8b33ff" padding="12px 0 0 0">SUGERENCIA</mj-text>
        <mj-text>{{message}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="24px 32px 8px 32px">
      <mj-column>
        <mj-button href="https://sonoriafm.com/sugerencias" background-color="#8b33ff" color="#ffffff" border-radius="24px">Revisar en el panel</mj-button>
      </mj-column>
    </mj-section>

    <mj-section padding="12px 32px 28px 32px">
      <mj-column>
        <mj-divider border-color="#e5e7eb" />
        <mj-text color="#8b8b99" font-size="12px" padding="12px 0 0 0">
          Has recibido este aviso porque eres administrador de SONORIA.
        </mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
