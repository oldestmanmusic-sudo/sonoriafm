version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sonoriafm-postgres
    environment:
      POSTGRES_USER: sonoriafm
      POSTGRES_PASSWORD: sonoriafm_dev_password
      POSTGRES_DB: sonoriafm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonoriafm -d sonoriafm"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonoriafm-backend
    environment:
      DATABASE_URL: postgresql://sonoriafm:sonoriafm_dev_password@postgres:5432/sonoriafm
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      NODE_ENV: development
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sonoriafm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sonoriafm.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    profiles:
      - tools

volumes:
  postgres_data:
  pgadmin_data: